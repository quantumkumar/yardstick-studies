[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "yardstick-studies"
version = "0.1.0"
description = "A verifiable-study kernel: fenced data, generated registration facts, gate board, replay attestations, and an LLM-study kit."
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
dependencies = ["numpy>=1.24", "scipy>=1.10", "jsonschema>=4.17"]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[project.scripts]
yardstick = "studies.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/studies"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
